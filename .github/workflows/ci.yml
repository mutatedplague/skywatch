name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.package }}

      - run: npm run typecheck
        working-directory: ${{ matrix.package }}

      - run: npm run build
        working-directory: ${{ matrix.package }}

  images:
    name: docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dump1090 image
        uses: docker/build-push-action@v6
        with:
          context: ./dump1090
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No radio and no network feed on a runner, so bring the stack up on the
      # simulator and check that the console and the API both answer.
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^ADSB_SOURCE=.*/ADSB_SOURCE=demo/' .env
          docker compose up -d --build backend frontend

      - name: Wait for the receiver
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:4000/api/health
          curl -fsS http://localhost:4000/api/aircraft | head -c 200
          echo

      - name: Wait for the console
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
